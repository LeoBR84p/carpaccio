# nginx config for the Iceland VPS.
# Replace vps.example.is with the actual domain.
# Let's Encrypt: certbot --nginx -d vps.example.is

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vps.example.is;

    ssl_certificate     /etc/letsencrypt/live/vps.example.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.example.is/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Zero access logs — no record of who downloaded what
    access_log off;
    error_log  /dev/null;

    # Telegram webhook + Cloud Run callback → bot (port 8080)
    location ~ ^/(telegram|callback) {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # One-time file delivery → delivery server (port 8000)
    location /d/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # Token registration → delivery server (HMAC-protected, public endpoint)
    location /register {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
